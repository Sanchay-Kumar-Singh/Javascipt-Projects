<!DOCTYPE html>
<html>
<head>
    <style>
        .clock {
            font-size: 70px;
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock"></div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById("clock").innerText =
                now.toLocaleTimeString();
        }

        setInterval(updateClock, 1000);
    </script>

</body>

</html>
