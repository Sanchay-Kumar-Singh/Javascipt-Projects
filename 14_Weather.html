<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Weather Search</title>

<style>
body{
    font-family: Arial;
    background:white;
    padding:20px;
}
h2{text-align:center;}
#search{
    display:block;
    margin:20px auto;
    padding:10px;
    width:300px;
}
.container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}
.card{
    width:220px;
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}
.card img{
    width:100%;
    height:140px;
    object-fit:cover;
}
</style>
</head>
<body>

<h2>City Weather Search</h2>
<input type="text" id="search" placeholder="Search city">
<div class="container" id="container"></div>

<script>
const cities = [
{city:"Delhi", temp:"35°C", weather:"Sunny", image:"https://images.unsplash.com/photo-1587474260584-136574528ed5"},
{city:"Mumbai", temp:"30°C", weather:"Cloudy", image:"https://images.unsplash.com/photo-1570168007204-dfb528c6958f"},
{city:"London", temp:"18°C", weather:"Rainy", image:"https://images.unsplash.com/photo-1513635269975-59663e0ac1ad"},
{city:"Tokyo", temp:"24°C", weather:"Clear", image:"https://images.unsplash.com/photo-1540959733332-eab4deabeeaf"},
{city:"Paris", temp:"20°C", weather:"Windy", image:"https://images.unsplash.com/photo-1502602898657-3e91760cbb34"},
{city:"New York", temp:"22°C", weather:"Sunny", image:"https://images.unsplash.com/photo-1499092346589-b9b6be3e94b2"},
{city:"Dubai", temp:"40°C", weather:"Hot", image:"https://images.unsplash.com/photo-1512453979798-5ea266f8880c"},
{city:"Sydney", temp:"26°C", weather:"Clear", image:"https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9"},
{city:"Berlin", temp:"19°C", weather:"Cold", image:"https://images.unsplash.com/photo-1560969184-10fe8719e047"},
{city:"Rome", temp:"27°C", weather:"Sunny", image:"https://images.unsplash.com/photo-1525874684015-58379d421a52"},
{city:"Moscow", temp:"10°C", weather:"Snow", image:"https://images.unsplash.com/photo-1513326738677-b964603b136d"},
{city:"Bangkok", temp:"33°C", weather:"Humid", image:"https://images.unsplash.com/photo-1508009603885-50cf7c579365"},
{city:"Singapore", temp:"31°C", weather:"Rainy", image:"https://images.unsplash.com/photo-1525625293386-3f8f99389edd"},
{city:"Toronto", temp:"15°C", weather:"Cold", image:"https://images.unsplash.com/photo-1517090504586-fde19ea6066f"},
{city:"Madrid", temp:"28°C", weather:"Sunny", image:"https://images.unsplash.com/photo-1539037116277-4db20889f2d4"},
{city:"Seoul", temp:"23°C", weather:"Cloudy", image:"https://images.unsplash.com/photo-1538485399081-7c897f1b13f1"},
{city:"Istanbul", temp:"25°C", weather:"Clear", image:"https://images.unsplash.com/photo-1524231757912-21f4fe3a7200"},
{city:"Cairo", temp:"37°C", weather:"Dry", image:"https://images.unsplash.com/photo-1572252009286-268acec5ca0a"},
{city:"Beijing", temp:"21°C", weather:"Foggy", image:"https://images.unsplash.com/photo-1547981609-4b6bf67dbf14"},
{city:"Los Angeles", temp:"29°C", weather:"Sunny", image:"https://images.unsplash.com/photo-1534190760961-74e8c1c5c3da"}
];


const search = document.getElementById("search");
const container = document.getElementById("container");

function showCities(data){
    container.innerHTML = "";
    data.forEach(item=>{
        container.innerHTML += `
            <div class="card">
                <img src="${item.image}">
                <h3>${item.city}</h3>
                <p>${item.temp}</p>
                <p>${item.weather}</p>
            </div>
        `;
    });
}

search.addEventListener("input", ()=>{
    const value = search.value.toLowerCase();
    const filtered = cities.filter(item =>
        item.city.toLowerCase().includes(value)
    );
    showCities(filtered);
});

showCities(cities);
</script>

</body>
</html>
