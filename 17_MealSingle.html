<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal API</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    padding:20px;
    text-align:center;
}

.card{
    width:300px;
    margin:auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 8px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.category{
    color:green;
    font-weight:bold;
}

</style>

</head>
<body>

<h1>Meal Data</h1>

<div class="card">

    <img id="mealImage" alt="Meal Image">

    <div class="content">

        <h3 id="mealName"></h3>

        <p class="category" id="mealCategory"></p>

        <p id="mealArea"></p>

    </div>

</div>

<script>

const mealImage = document.getElementById("mealImage");
const mealName = document.getElementById("mealName");
const mealCategory = document.getElementById("mealCategory");
const mealArea = document.getElementById("mealArea");

async function fetchMeal(){

    try{

        const response = await fetch("https://www.themealdb.com/api/json/v1/1/search.php?f=a");

        if(!response.ok){
            throw new Error("Failed to fetch meals");
        }

        const data = await response.json();

        const meal = data.meals[0];

        showMeal(meal);

    }

    catch(error){

        console.error(error);

    }

}

function showMeal(meal){

    mealImage.src = meal.strMealThumb;
    mealImage.alt = meal.strMeal;

    mealName.textContent = meal.strMeal;

    mealCategory.textContent = meal.strCategory;

    mealArea.textContent = meal.strArea;

}

fetchMeal();

</script>

</body>
</html>
