<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

#meal-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 10px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.content h2{
    margin-bottom:10px;
}

.content p{
    color:#555;
    line-height:1.5;
}

.loading{
    text-align:center;
    font-size:20px;
}
</style>

</head>
<body>

<h1>🍽️ Meal Cards</h1>

<div id="meal-container" class="loading">
    Loading Meals...
</div>

<script>

const container = document.getElementById("meal-container");

async function getMeals(){

    try{

        const response = await fetch("https://www.themealdb.com/api/json/v1/1/search.php?f=a");

        const data = await response.json();

        displayMeals(data.meals);

    }
    catch(error){

        container.innerHTML="<h2>Something went wrong!</h2>";
        console.log(error);

    }

}

function displayMeals(meals){

    container.classList.remove("loading");

    container.innerHTML="";

    meals.forEach((meal)=>{

        container.innerHTML += `
        
        <div class="card">

            <img src="${meal.strMealThumb}" alt="${meal.strMeal}">

            <div class="content">

                <h2>${meal.strMeal}</h2>

                <p>${meal.strInstructions.substring(0,120)}...</p>

            </div>

        </div>

        `;

    });

}

getMeals();

</script>

</body>
</html>
