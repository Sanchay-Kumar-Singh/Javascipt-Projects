<!DOCTYPE html>
<html>
<body style="text-align:center">

<button onclick="showTab('one')">Tab 1</button>
<button onclick="showTab('two')">Tab 2</button>

<div class="tab" id="one">Content One</div>
<div class="tab" id="two">Content Two</div>

<script>
    
    document.querySelectorAll(".tab").forEach(tab => {
        tab.style.display = "none";
    });

    function showTab(id) {
       
        document.querySelectorAll(".tab").forEach(tab => {
            tab.style.display = "none";
        });

  
        document.getElementById(id).style.display = "block";
    }
</script>

</body>
</html>
