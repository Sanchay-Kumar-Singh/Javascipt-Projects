
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Meal</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    padding:20px;
    text-align:center;
}

input{
    width:300px;
    padding:10px;
    font-size:16px;
    margin-bottom:20px;
}

#mealContainer{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:250px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 8px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.category{
    color:green;
    font-weight:bold;
}

template{
    display:none;
}

</style>

</head>
<body>

<h1>Meal Search</h1>

<input
type="text"
id="searchInput"
placeholder="Search Meal...">

<div id="mealContainer"></div>

<template id="mealTemplate">

    <div class="card">

        <img class="mealImage">

        <div class="content">

            <h3 class="mealName"></h3>

            <p class="category mealCategory"></p>

            <p class="mealArea"></p>

        </div>

    </div>

</template>

<script>

const mealContainer = document.getElementById("mealContainer");

const searchInput = document.getElementById("searchInput");

const template = document.getElementById("mealTemplate");

async function fetchMeals(query = "a"){

    try{

        const response = await fetch(
            `https://www.themealdb.com/api/json/v1/1/search.php?s=${query}`
        );

        if(!response.ok){

            throw new Error("Failed to Fetch");

        }

        const data = await response.json();

        showMeals(data.meals);

    }

    catch(error){

        console.error(error);

    }

}

function showMeals(meals){

    mealContainer.innerHTML = "";

    if(!meals){

        mealContainer.innerHTML = "<h2>No Meal Found</h2>";

        return;

    }

    meals.forEach(function(meal){

        const clone = template.content.cloneNode(true);

        clone.querySelector(".mealImage").src = meal.strMealThumb;

        clone.querySelector(".mealImage").alt = meal.strMeal;

        clone.querySelector(".mealName").textContent = meal.strMeal;

        clone.querySelector(".mealCategory").textContent = meal.strCategory;

        clone.querySelector(".mealArea").textContent = meal.strArea;

        mealContainer.appendChild(clone);

    });

}

searchInput.addEventListener("input", function(){

    fetchMeals(searchInput.value.trim());

});

fetchMeals();

</script>

</body>
</html>
